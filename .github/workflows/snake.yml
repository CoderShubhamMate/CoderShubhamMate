name: Generate Snake Game

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (to get the generator script)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate snake game SVGs
        run: node .github/scripts/generate-snake.mjs
        env:
          STEP_SECONDS: "0.5"
          GH_USER: CoderShubhamMate
          # Uses a personal access token if you add one called GH_PAT, otherwise the default token
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          OUT_DIR: dist
          # ---- optional game tuning (uncomment to change) ----
          # STAR_MIN: "8"            # min contributions in a day to become a star (default: auto)
          # GROW_NORMAL: "1"         # growth for a normal contribution block
          # GROW_STAR: "2"           # growth for a star (default = 2x normal)
          # MAX_SNAKE_LENGTH: "30"   # cap on snake length
          # TARGET_SECONDS: "35"     # how long the eating phase should last (lower = faster snake)

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
