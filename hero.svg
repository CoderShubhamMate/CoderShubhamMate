<text x="872" y="24" text-anchor="end" font-size="12" fill="#4ade80">all systems operational</text>
<text x="450" y="134" text-anchor="middle" font-size="62" font-weight="800" letter-spacing="5" fill="url(#tg)">SHUBHAM MATE</text>
<text x="450" y="172" text-anchor="middle" font-size="17" fill="#94a3b8" xml:space="preserve" textLength="585" lengthAdjust="spacing">Software Engineer  |  System Design  |  Blockchain Systems</text>
<g class="tg t0" style="animation-delay:0s"><text x="450" y="214" text-anchor="middle" font-size="16" fill="#7dd3fc"><tspan fill="#22d3ee">&gt; </tspan>Designing scalable and reliable backend systems</text><rect class="cur" x="690.2" y="201" width="9" height="16" fill="#22d3ee"/></g>
<g class="tg t1" style="animation-delay:4s"><text x="450" y="214" text-anchor="middle" font-size="16" fill="#7dd3fc"><tspan fill="#22d3ee">&gt; </tspan>Studying distributed systems, one trade-off at a time</text><rect class="cur" x="719.0" y="201" width="9" height="16" fill="#22d3ee"/></g>
<g class="tg t2" style="animation-delay:8s"><text x="450" y="214" text-anchor="middle" font-size="16" fill="#7dd3fc"><tspan fill="#22d3ee">&gt; </tspan>Case study: BBSNS - gasless relay, workers, multi-sig governance</text><rect class="cur" x="771.8" y="201" width="9" height="16" fill="#22d3ee"/></g>
<g class="tg t3" style="animation-delay:12s"><text x="450" y="214" text-anchor="middle" font-size="16" fill="#7dd3fc"><tspan fill="#22d3ee">&gt; </tspan>Replace legacy trust with cryptographic proof.</text><rect class="cur" x="685.4" y="201" width="9" height="16" fill="#22d3ee"/></g>
